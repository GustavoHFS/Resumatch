name: CI e Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências Python
        run: python -m pip install -e ".[dev]"
      - name: Instalar Chromium para testes A4
        run: python -m playwright install --with-deps chromium-headless-shell
      - name: Instalar dependências frontend
        run: npm --prefix frontend ci
      - name: Compilar interface
        run: npm --prefix frontend run build
      - name: Verificar privacidade após instalação e build
        run: python scripts/check_privacy.py
      - name: Executar testes isolados
        run: python -m pytest -v
      - name: Compilar launcher Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: python scripts/build_launcher_exe.py
      - name: Empacotar somente arquivos públicos
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        with:
          name: Resumatch-Windows
          path: build/Resumatch-Windows.zip
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Resumatch-Windows
          path: release
      - name: Publicar ZIP na tag validada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release/Resumatch-Windows.zip --verify-tag --generate-notes --title "Resumatch $env:RELEASE_TAG"
