[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumatch"
version = "0.1.0"
description = "Resumatch — Local-first deterministic job discovery, triage, and ATS-clean A4 resume studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.21,<1.0",
    "httpx>=0.27,<1.0",
    "truststore>=0.9,<1.0",
    "selectolax>=0.3.21,<1.0",
    "apscheduler>=3.10,<4.0",
    "jinja2>=3.1,<4.0",
    "pypdf>=4.2,<6.0",
    "playwright>=1.45,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
